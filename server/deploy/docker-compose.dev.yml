# 开发/本地环境：PostgreSQL + Redis（生产用云 PG，见设计 15.8 条件①）
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: yodian-pg
    environment:
      POSTGRES_USER: yodian
      POSTGRES_PASSWORD: yodian_dev
      POSTGRES_DB: yodian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yodian"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yodian-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
